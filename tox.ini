[tox]
isolated_build = true
skipsdist = true
usedevelop = true
envlist = django52

[testenv]
setenv =
    django52: DJANGO_SETTINGS_MODULE = tests.test_settingsAA4
passenv =
    CT_TEST_DB
    DB_*
deps=
    django52: allianceauth>=5.0.0
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

commands=
    coverage run -m pytest --md-report --md-report-flavor github --md-report-exclude-outcomes passed --md-report-verbose=1 --md-report-output=test-summary.md
    pip list
    coverage xml
    coverage html
    coverage report -m
