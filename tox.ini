[tox]
isolated_build = true
skipsdist = true
usedevelop = true
envlist = django52

[testenv]
setenv =
    django52: DJANGO_SETTINGS_MODULE = tests.test_settingsAA4
deps=
    django52: allianceauth>=5.0.0
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

commands=
    coverage run runtests.py authstats -v 2 --debug-mode
    pip list
    coverage xml
    coverage html
    coverage report -m
